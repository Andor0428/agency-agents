version: '3.8'
services:
  api:
    build: ./stock-take-api
    ports:
      - '3001:3001'
    env_file:
      - ./stock-take-api/.env
    volumes:
      - api-data:/app/data

  admin:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - ./stock-take-admin:/app
    depends_on:
      - api

volumes:
  api-data:
